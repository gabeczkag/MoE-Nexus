<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
    <linearGradient id="expert1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="expert2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="expert3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="expert4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="expert5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="expert6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30cfd0"/>
      <stop offset="100%" stop-color="#330867"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#f8fafc" rx="12"/>

  <text x="600" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a202c">Architektura MoE-Nexus: Mixture of Experts</text>

  <rect x="40" y="55" width="200" height="50" rx="8" fill="#2d3748" filter="url(#shadow)"/>
  <text x="140" y="82" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Input Tokens</text>
  <text x="140" y="98" font-family="monospace" font-size="11" text-anchor="middle" fill="#a0aec0">[B, T, D]</text>

  <path d="M240 80 L320 80" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="55" width="200" height="50" rx="8" fill="#2b6cb0" filter="url(#shadow)"/>
  <text x="420" y="82" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Router (Gate)</text>
  <text x="420" y="98" font-family="monospace" font-size="11" text-anchor="middle" fill="#bee3f8">Top-K / ExpertChoice</text>

  <path d="M520 80 L600 80" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="30" width="520" height="100" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-dasharray="4,4"/>
  <text x="860" y="52" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#4a5568">Expert Pool (N ekspertów)</text>

  <rect x="620" y="65" width="80" height="50" rx="6" fill="url(#expert1)" filter="url(#shadow)"/>
  <text x="660" y="85" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">E₀</text>
  <text x="660" y="102" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffffff" opacity="0.9">FFN</text>

  <rect x="715" y="65" width="80" height="50" rx="6" fill="url(#expert2)" filter="url(#shadow)"/>
  <text x="755" y="85" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">E₁</text>
  <text x="755" y="102" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffffff" opacity="0.9">FFN</text>

  <rect x="810" y="65" width="80" height="50" rx="6" fill="url(#expert3)" filter="url(#shadow)"/>
  <text x="850" y="85" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">E₂</text>
  <text x="850" y="102" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffffff" opacity="0.9">FFN</text>

  <rect x="905" y="65" width="80" height="50" rx="6" fill="url(#expert4)" filter="url(#shadow)"/>
  <text x="945" y="85" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">E₃</text>
  <text x="945" y="102" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffffff" opacity="0.9">FFN</text>

  <rect x="1000" y="65" width="80" height="50" rx="6" fill="url(#expert5)" filter="url(#shadow)"/>
  <text x="1040" y="85" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">E₄</text>
  <text x="1040" y="102" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffffff" opacity="0.9">FFN</text>

  <text x="860" y="125" font-family="monospace" font-size="10" text-anchor="middle" fill="#718096">... więcej ekspertów ...</text>

  <path d="M860 130 L860 165" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="165" width="280" height="55" rx="8" fill="#38a169" filter="url(#shadow)"/>
  <text x="860" y="188" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Weighted Aggregation</text>
  <text x="860" y="206" font-family="monospace" font-size="11" text-anchor="middle" fill="#c6f6d5">Σ (scoreᵢ · expertᵢ(x))</text>

  <path d="M860 220 L860 255" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="255" width="280" height="55" rx="8" fill="#d53f8c" filter="url(#shadow)"/>
  <text x="860" y="278" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Load Balancer</text>
  <text x="860" y="296" font-family="monospace" font-size="11" text-anchor="middle" fill="#fed7e2">ExpertStats + BalanceResult</text>

  <path d="M720 282 L600 282" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M1000 282 L1100 282 L1100 80 L1120 80" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <path d="M860 310 L860 345" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="345" width="280" height="50" rx="8" fill="#2d3748" filter="url(#shadow)"/>
  <text x="860" y="368" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Output Hidden States</text>
  <text x="860" y="384" font-family="monospace" font-size="11" text-anchor="middle" fill="#a0aec0">[B, T, D]</text>

  <line x1="100" y1="140" x2="300" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="500" y1="140" x2="1100" y2="140" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="60" y="155" width="240" height="90" rx="6" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="180" y="175" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#2b6cb0">🔑 Kluczowe cechy</text>
  <text x="180" y="195" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• Sparse activation (Top-K)</text>
  <text x="180" y="212" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• Auxiliary Z-loss</text>
  <text x="180" y="229" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• ExpertChoice routing</text>

  <rect x="340" y="155" width="240" height="90" rx="6" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1"/>
  <text x="460" y="175" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#6b46c1">⚡ Optymalizacje</text>
  <text x="460" y="195" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• Load balancing</text>
  <text x="460" y="212" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• Expert pruning</text>
  <text x="460" y="229" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">• Inference serving</text>

  <rect x="620" y="155" width="260" height="90" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
  <text x="750" y="175" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#276749">🛠️ Stack</text>
  <text x="750" y="195" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">PyTorch ≥ 2.0</text>
  <text x="750" y="212" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">Python ≥ 3.10</text>
  <text x="750" y="229" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">GNU GPL v3</text>

  <rect x="920" y="155" width="220" height="90" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="1030" y="175" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#c53030">📊 Monitoring</text>
  <text x="1030" y="195" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">Expert utilization</text>
  <text x="1030" y="212" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">Routing entropy</text>
  <text x="1030" y="229" font-family="monospace" font-size="10" text-anchor="middle" fill="#4a5568">Sparsity metrics</text>
</svg>
